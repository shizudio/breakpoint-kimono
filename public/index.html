<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Breakpoint Kimono — Shizudio</title>
<meta name="description" content="The Breakpoint Kimono presale is moving to its own home. Write to @shizudio.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@300&display=swap">
<style>
:root{--ground:#000;--ink:#F7F4EE;--hair:rgba(247,244,238,.12);--link:#9B89A3;--accent2:#14F195}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-weight:300;
     display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vw,60px);-webkit-font-smoothing:antialiased}
main{max-width:34rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px}
img{width:76px;height:76px;object-fit:contain;filter:brightness(0) invert(1);opacity:.5}
.eyebrow{margin:0;font-size:9px;letter-spacing:.34em;text-transform:uppercase;opacity:.4}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(28px,5vw,44px);line-height:1.1}
p{margin:0;font-size:15px;line-height:1.88;opacity:.72;max-width:42ch}
hr{border:0;border-top:.5px solid var(--hair);width:100%;margin:4px 0}
a{color:var(--link);text-decoration:none;border-bottom:.5px solid rgba(155,137,163,.5);transition:color .2s}
a:hover{color:var(--accent2)}
</style>
</head>
<body>
<main>
  <img src="assets/logo.png" alt="岩花" lang="zh-Hans">
  <p class="eyebrow">Shizudio · Breakpoint 2026</p>
  <h1>The presale is moving.</h1>
  <p>This page is no longer where the fifteen are sold. We are putting it back up on its own home, with payment that settles on chain.</p>
  <hr>
  <p>To reserve a piece in the meantime, write to <a href="https://x.com/shizudio" target="_blank" rel="noopener">@shizudio</a>.</p>
</main>
</body>
</html>
